server:
  port: 8080

spring:
  autoconfigure:
    exclude:
      - org.springframework.cloud.aws.autoconfigure.context.ContextInstanceDataAutoConfiguration
      - org.springframework.cloud.aws.autoconfigure.context.ContextCredentialsAutoConfiguration
      - org.springframework.cloud.aws.autoconfigure.context.ContextRegionProviderAutoConfiguration
      - org.springframework.cloud.aws.autoconfigure.context.ContextResourceLoaderAutoConfiguration
      - org.springframework.cloud.aws.autoconfigure.context.ContextStackAutoConfiguration
      - org.springframework.cloud.aws.autoconfigure.mail.MailSenderAutoConfiguration
      - org.springframework.cloud.aws.autoconfigure.cache.ElastiCacheAutoConfiguration
      - org.springframework.cloud.aws.autoconfigure.messaging.MessagingAutoConfiguration
      - org.springframework.cloud.aws.autoconfigure.jdbc.AmazonRdsDatabaseAutoConfiguration
      - org.springframework.cloud.aws.autoconfigure.metrics.CloudWatchExportAutoConfiguration
  datasource:
    url: ${LOCAL_DB_URL:jdbc:mariadb://localhost:3306/bdbd?allowPublicKeyRetrieval=true&useSSL=false}
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${LOCAL_DB_USERNAME:bdbd}
    password: ${LOCAL_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

cloud:
  aws:
    credentials:
      accessKey: ""
      secretKey: ""
    region:
      static: ap-northeast-2
    s3:
      bucket: ""
    proxy:
      host: ""
      port: 0
    stack:
      auto: false

storage:
  s3:
    enabled: false
  local:
    directory: ${LOCAL_FILE_DIRECTORY:./uploads}
    base-url: ${LOCAL_FILE_BASE_URL:http://localhost:8080/uploads}

kakao:
  admin:
    key: ""

payment:
  external:
    enabled: false
  approval-url: http://localhost:5173/paymentwaiting
  cancel-url: http://localhost:5173/paymentfail
  fail-url: http://localhost:5173/paymentfail

frontend:
  localurl: ${LOCAL_FRONTEND_ORIGIN:http://localhost:5173}
  localurls: ${LOCAL_FRONTEND_ORIGINS:http://localhost:5173,http://localhost:5174}
  prod:
    userurl: ""
    ownerurl: ""

security:
  jwt:
    secret: ${LOCAL_JWT_SECRET}

logging:
  level:
    '[bdbe.bdbd]': INFO
